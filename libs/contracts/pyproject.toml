[project]
name = "close-contracts"
version = "0.1.0"
description = "Shared contracts for the close platform: IDs, canonical JSON, money, calendars, table naming. Pure Python, no Spark."
requires-python = ">=3.12,<3.13"
# Pydantic (configuration models and the rule DSL, Stage 2) is preinstalled on Databricks Runtime 18 LTS at the
# version the workspace locks (2.10.6), so the wheel still installs there without pulling anything new.
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/close_contracts"]
