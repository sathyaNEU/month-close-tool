# Alembic configuration for the close platform control-plane schema.
# Connection settings come from the PG* environment (see migrations/env.py), never from this file.
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
