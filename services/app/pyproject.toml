[project]
name = "close-app"
version = "0.1.0"
description = "Close platform backend, deployed as a Databricks App (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "close-contracts",
  "close-platform",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
connect = ["close-platform[connect]"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/close_app"]

[tool.uv.sources]
close-contracts = { workspace = true }
close-platform = { workspace = true }
