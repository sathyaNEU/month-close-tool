[project]
name = "close-jobs-emulator"
version = "0.1.0"
description = "Local stand-in for the Databricks Jobs API 2.2 subset the close platform uses (runs spark-submit)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/close_jobs_emulator"]
