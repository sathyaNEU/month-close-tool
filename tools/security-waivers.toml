# Reviewed exceptions for the security scanners run by `make security` and the stage gates.
# Every waiver states the advisory, why it does not apply (quoting the advisory where possible),
# who reviewed it, and an expiry date. After the expiry date the gate fails again until re-reviewed.

[[pip_audit]]
id = "PYSEC-2026-113"
aliases = ["CVE-2026-25087", "GHSA-rgxp-2hwp-jwgg"]
package = "pyarrow"
version = "21.0.0"
reason = """
Arrow C++ IPC reader bug when pre-buffering is enabled (CVSS 7.4). The advisory states: "The
functionality is not exposed in language bindings (Python, Ruby, C GLib), so these bindings are not
vulnerable." pyarrow is pinned to 21.0.0 to mirror Databricks Runtime 18 LTS. The engine wheel does not
ship it (the Databricks runtime provides pyarrow), but since Stage 1b the app does: the Spark Connect
client (pyspark-client) needs it, and the app keeps the DBR version so it runs exactly what the tests
run. The app only reads Arrow results from our own Spark Connect server, through the Python bindings,
so the waived code path is not reachable from it either. Re-review when DBR 18 updates its bundled
pyarrow, or at the Stage 10 parity review, whichever is first.
"""
source = "https://api.osv.dev/v1/vulns/PYSEC-2026-113"
reviewed = "2026-09-26"
expires = "2026-12-31"
owner = "platform engineering lead (default accepted at the Stage 0 sign-off on 2026-09-27)"

# trivy (make scan): see tools/run_trivy.py for the policy. `images` lists where a waiver applies;
# `id = "*"` with a `path` covers every finding inside one jar.

[[trivy]]
id = "CVE-2026-25087"
images = ["close-app:local", "close-spark:local"]
package = "pyarrow"
reason = """
The same advisory as PYSEC-2026-113 above (its CVE alias): an Arrow C++ IPC reader bug that the
advisory says is not exposed in the Python bindings. pyarrow stays at 21.0.0 to mirror DBR 18, in the
engine image and in the app (the Spark Connect client needs it). Re-review with the pip-audit waiver.
"""
reviewed = "2026-09-27"
expires = "2026-12-31"
owner = "platform engineering lead"

[[trivy]]
id = "*"
images = ["close-spark:local"]
path = "software.amazon.awssdk_bundle-2.29.52.jar"
reason = """
Findings inside the AWS SDK v2 bundle 2.29.52 (a shaded netty 4.1.115 and the CloudFront module),
which hadoop-aws 3.4.2 requires; hadoop-aws must match the Hadoop version pyspark 4.1.3 bundles, so
the bundle cannot move on its own. close-spark is a local-only image: its S3A client talks only to
SeaweedFS on the private Compose network and never uses CloudFront. Production runs on Databricks'
own runtime. Re-review when pyspark or hadoop-aws moves, or by the expiry date.
"""
reviewed = "2026-09-27"
expires = "2026-12-31"
owner = "platform engineering lead"
