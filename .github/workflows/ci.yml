# CI runs the same make targets as `make ci` and the stage gates, so a green gate locally means a green
# pipeline. Hardening: every action is pinned to a full commit SHA, the token has no permissions
# unless a job asks for them, and checkout never persists credentials. Lint: `make lint-workflows`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: versions, lint, types, workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --all-packages --locked
      - run: make check-versions lint typecheck lint-workflows

  tests:
    name: unit, Spark, wheels, parity, platform, app, emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --all-packages --locked
      - run: make secrets
      - run: make test-unit test-reference test-spark wheel-smoke test-parity test-platform test-app test-emulator

  security:
    name: bandit, pip-audit, gitleaks, trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --all-packages --locked
      - run: make secrets
      - run: make security images scan
